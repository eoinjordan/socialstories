name: Deploy to Vercel

# Two ways to deploy this app, and you only want one of them:
#
#   1. Vercel's own Git integration (recommended). Import the repo at
#      vercel.com, set the root directory to `web/`, and Vercel builds every
#      push and every PR by itself. Nothing here is needed — delete this file.
#
#   2. This workflow, for when the deploy has to be gated on CI passing, or
#      when you want the deploy to live in the same place as everything else.
#      Needs three repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID and
#      VERCEL_PROJECT_ID (the last two are in web/.vercel/project.json after
#      running `vercel link` locally).
#
# Without those secrets every job here is skipped, so the repository still
# works for anyone who clones it.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-vercel.yml"]
  pull_request:
    paths: ["web/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: web

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No VERCEL_TOKEN secret set — skipping deploy. See the comment at the top of this workflow."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.available == 'true'
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: steps.creds.outputs.available == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.creds.outputs.available == 'true'
        run: |
          vercel pull --yes \
            --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        if: steps.creds.outputs.available == 'true'
        run: |
          vercel build ${{ github.event_name != 'pull_request' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.available == 'true'
        run: |
          url=$(vercel deploy --prebuilt \
            ${{ github.event_name != 'pull_request' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
